name: NEXUS 33 - Connector Probe

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Connector visibility probe
        run: |
          echo "NEXUS_CONNECTOR_PR_RUN=VISIBLE"
          echo "This workflow exists only to expose PR-triggered Actions to the connector."

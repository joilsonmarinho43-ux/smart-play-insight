name: NEXUS 33 - Functional E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: Browser real - NEXUS 33
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Diagnose production auth user
        env:
          VPS_HOST: ${{ secrets.NEXUS_VPS_HOST }}
          VPS_USER: ${{ secrets.NEXUS_VPS_USER }}
          VPS_PORT: ${{ secrets.NEXUS_VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.NEXUS_VPS_SSH_KEY }}
        run: |
          set -e
          install -m 600 /dev/null /tmp/nexus_key
          printf '%s\n' "$VPS_SSH_KEY" > /tmp/nexus_key
          ssh -o StrictHostKeyChecking=no -i /tmp/nexus_key -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" \
            'docker exec supabase-db psql -U postgres -d postgres -Atc "select u.email, u.email_confirmed_at is not null, u.banned_until is null, u.deleted_at is null, u.last_sign_in_at, coalesce(p.is_admin,false) from auth.users u left join public.profiles p on p.id=u.id where lower(u.email)=lower('\''joilsonmoreiramarinho@gmail.com'\'');"'
          rm -f /tmp/nexus_key

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Prepare isolated E2E runner
        run: |
          mkdir -p e2e-runner
          cd e2e-runner
          npm init -y
          npm install playwright

      - name: Install Playwright Chromium
        run: |
          cd e2e-runner
          npx playwright install --with-deps chromium

      - name: Run NEXUS 33 functional browser test
        env:
          NEXUS_E2E_EMAIL: ${{ secrets.NEXUS_E2E_EMAIL }}
          NEXUS_E2E_PASSWORD: ${{ secrets.NEXUS_E2E_PASSWORD }}
        run: |
          mkdir -p e2e-runner

          cat > e2e-runner/nexus-functional.spec.js <<'EOF'
          const { chromium } = require('playwright');

          const BASE_URL = 'https://analista.funecob.com.br';

          const routes = [
            '/',
            '/live',
            '/scanner',
            '/favorites',
            '/suggestions',
            '/bingo',
            '/elite',
            '/placar-exato',
            '/bet-analyzer'
          ];

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              deviceScaleFactor: 1,
              ignoreHTTPSErrors: false
            });

            const page = await context.newPage();

            const failures = [];
            const authNetwork = [];

            page.on('pageerror', error => {
              failures.push(`PAGE ERROR: ${error.message}`);
            });

            page.on('requestfailed', request => {
              const url = request.url();
              if (/auth|supabase/i.test(url)) {
                authNetwork.push(`REQUEST FAILED: ${request.method()} ${url} :: ${request.failure()?.errorText || 'unknown'}`);
              }
            });

            page.on('response', response => {
              const url = response.url();
              const status = response.status();
              const method = response.request().method();

              if (/auth|supabase/i.test(url)) {
                console.log(`AUTH RESPONSE: ${status} ${method} ${url}`);
              }

              if (status >= 400) {
                console.log(`HTTP ERROR RESPONSE: ${status} ${method} ${url}`);
              }
            });

            page.on('requestfailed', request => {
              const url = request.url();
              console.log(`REQUEST FAILED: ${request.method()} ${url} :: ${request.failure()?.errorText || 'unknown'}`);
            });

            page.on('console', message => {
              if (message.type() === 'error') {
                failures.push(`CONSOLE ERROR: ${message.text()}`);
              }
            });

            console.log('=== NEXUS 33 E2E ===');
            console.log(`URL: ${BASE_URL}`);

            await page.goto(`${BASE_URL}/auth`, {
              waitUntil: 'domcontentloaded',
              timeout: 60000
            });

            console.log(`AUTH URL: ${page.url()}`);

            const email = page.locator(
              'input[type="email"], input[name="email"], input[autocomplete="email"]'
            ).first();

            const password = page.locator(
              'input[type="password"], input[name="password"], input[autocomplete="current-password"]'
            ).first();

            await email.waitFor({ state: 'visible', timeout: 30000 });
            await password.waitFor({ state: 'visible', timeout: 30000 });

            await email.fill(process.env.NEXUS_E2E_EMAIL);
            await password.fill(process.env.NEXUS_E2E_PASSWORD);

            const loginButton = page.locator(
              'button[type="submit"], button:has-text("Entrar"), button:has-text("Login"), button:has-text("Acessar")'
            ).first();

            await loginButton.waitFor({
              state: 'visible',
              timeout: 15000
            });

            await loginButton.click();

            await page.waitForTimeout(5000);

            console.log(`AFTER LOGIN URL: ${page.url()}`);

            await page.screenshot({
              path: 'nexus-after-login.png',
              fullPage: true
            });

            if (page.url().includes('/auth')) {
              console.log('=== LOGIN DIAGNOSTICS ===');
              console.log('VISIBLE TEXT:');
              console.log((await page.locator('body').innerText()).slice(0, 12000));
              console.log('EMAIL VALUE:', await email.inputValue());
              console.log('PASSWORD FILLED:', Boolean(await password.inputValue()));
              console.log('LOGIN BUTTON TEXT:', await loginButton.innerText().catch(() => 'UNAVAILABLE'));
              console.log('AUTH NETWORK FAILURES:');
              authNetwork.forEach(item => console.log(item));
              await page.screenshot({ path: 'nexus-login-failed.png', fullPage: true });
              throw new Error('LOGIN FAILED: usuário permaneceu na tela /auth');
            }

            console.log('LOGIN: PASSOU');

            for (const route of routes) {
              console.log(`\nTESTANDO: ${route}`);

              try {
                const response = await page.goto(`${BASE_URL}${route}`, {
                  waitUntil: 'domcontentloaded',
                  timeout: 60000
                });

                await page.waitForTimeout(2500);

                const status = response ? response.status() : 'NO_RESPONSE';
                const title = await page.title();

                console.log(`HTTP: ${status}`);
                console.log(`FINAL URL: ${page.url()}`);
                console.log(`TITLE: ${title}`);

                if (status >= 500) {
                  throw new Error(`HTTP ${status}`);
                }

                if (page.url().includes('/auth')) {
                  throw new Error('REDIRECTED TO AUTH');
                }

                await page.screenshot({
                  path: `nexus-${route === '/' ? 'home' : route.slice(1).replaceAll('/', '-')}.png`,
                  fullPage: true
                });

                console.log(`RESULTADO ${route}: PASSOU`);
              } catch (error) {
                console.log(`RESULTADO ${route}: FALHOU`);
                console.log(error.message);
                failures.push(`${route}: ${error.message}`);
              }
            }

            // Deep functional audit: open a real match and exercise the statistics/reading UI.
            console.log('\
TESTE PROFUNDO: /match/:id');
            await page.goto(BASE_URL + '/', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(2500);
            const matchLink = page.locator('a[href*="/match/"]').first();
            if (await matchLink.count() > 0) {
              const href = await matchLink.getAttribute('href');
              if (!href) throw new Error('MATCH LINK WITHOUT HREF');
              await page.goto(BASE_URL + href, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForTimeout(3500);
              if (page.url().includes('/auth')) throw new Error('MATCH DETAILS REDIRECTED TO AUTH');
              const body = await page.locator('body').innerText();
              const required = ['Estatísticas completas','Posse','Finalizações','No alvo','Grandes chances','Escanteios','Impedimentos','Faltas','Cartões amarelos','xG'];
              const missing = required.filter(x => !body.includes(x));
              if (missing.length) throw new Error('MATCH DETAILS MISSING: ' + missing.join(', '));
              await page.screenshot({ path: 'nexus-match-details.png', fullPage: true });
              console.log('MATCH DETAILS: PASSOU');
            } else {
              console.log('MATCH DETAILS: BLOQUEADO - nenhum link de jogo disponível no momento');
            }

            console.log('TESTE PROFUNDO: abas e Leitura do Jogo');
            await page.goto(BASE_URL + '/', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(2500);
            const statsTab = page.getByRole('button', { name: 'Estatísticas' }).first();
            const poissonTab = page.getByRole('button', { name: 'Poisson' }).first();
            const ticketTab = page.getByRole('button', { name: 'Bilhete' }).first();
            if (await statsTab.count() > 0 && await poissonTab.count() > 0 && await ticketTab.count() > 0) {
              await poissonTab.click(); await page.waitForTimeout(400);
              if (!(await page.locator('body').innerText()).includes('Poisson')) throw new Error('POISSON TAB DID NOT RENDER');
              await ticketTab.click(); await page.waitForTimeout(400);
              if (!(await page.locator('body').innerText()).includes('Bilhete')) throw new Error('TICKET TAB DID NOT RENDER');
              await statsTab.click();
              const reading = page.getByRole('button', { name: /Leitura do Jogo/i }).first();
              if (await reading.count() > 0) {
                await reading.click();
                await page.waitForTimeout(1200);
                if (!(await page.locator('body').innerText()).includes('Leitura')) throw new Error('READING MODAL DID NOT OPEN');
                await page.screenshot({ path: 'nexus-reading-modal.png', fullPage: true });
                console.log('TABS + LEITURA: PASSOU');
              } else {
                throw new Error('LEITURA DO JOGO BUTTON NOT FOUND');
              }
            } else {
              console.log('TABS + LEITURA: BLOQUEADO - cards sem dados disponíveis');
            }

            // Admin/diagnostic pages must at least resolve without server errors.
            for (const route of ['/admin','/quality','/diagnostics','/context']) {
              const response = await page.goto(BASE_URL + route, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForTimeout(1200);
              const status = response ? response.status() : 0;
              if (status >= 500) throw new Error(route + ' HTTP ' + status);
              if (page.url().includes('/auth')) throw new Error(route + ' REDIRECTED TO AUTH');
              console.log('ADMIN AREA ' + route + ': PASSOU (' + page.url() + ')');
            }

            const logoutButton = page.getByRole('button', { name: /SAIR/i }).first();
            if (await logoutButton.count() > 0) {
              await logoutButton.click();
              await page.waitForTimeout(1500);
              if (!page.url().includes('/auth')) throw new Error('LOGOUT DID NOT RETURN TO AUTH');
              console.log('LOGOUT/SESSION: PASSOU');
            } else {
              throw new Error('LOGOUT BUTTON NOT FOUND');
            }

            console.log('\n=== RESULTADO FINAL ===');

            if (failures.length > 0) {
              console.log('FALHAS ENCONTRADAS:');
              failures.forEach(f => console.log(`- ${f}`));

              await browser.close();
              process.exit(1);
            }

            console.log('TODOS OS TESTES PASSARAM');

            await browser.close();
          })();
          EOF

          node e2e-runner/nexus-functional.spec.js

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-e2e-evidence
          path: |
            nexus-*.png
          if-no-files-found: ignore

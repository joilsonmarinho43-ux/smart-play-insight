name: Nexus one-shot dependency fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: contains(github.event.head_commit.message, 'fix(ui): remove stale bookmaker dependency') == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Remove stale BookmakerFinder dependency
        shell: bash
        run: |
          set -euo pipefail
          FILE="src/components/MatchReadingModal.tsx"
          test -f "$FILE"
          grep -q 'BookmakerFinder' "$FILE"
          sed -i '/import { BookmakerFinder } from "@\/components\/BookmakerFinder";/d' "$FILE"
          sed -i '/<BookmakerFinder homeTeam={homeTeam} awayTeam={awayTeam} \/>/d' "$FILE"
          if grep -q 'BookmakerFinder' "$FILE"; then
            echo 'BookmakerFinder references still remain:'
            grep -n 'BookmakerFinder' "$FILE"
            exit 1
          fi

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/MatchReadingModal.tsx
          rm -f .github/workflows/nexus-fix-bookmaker-dependency.yml
          git add -A .github/workflows/nexus-fix-bookmaker-dependency.yml
          git commit -m "fix(ui): remove stale bookmaker dependency"
          git push origin HEAD:main

name: Nexus Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Governance audit — analyst only
        run: node scripts/nexus-governance-audit.mjs

      - name: AI provider governance audit
        run: node scripts/nexus-ai-governance-audit.mjs

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test -- --run

      - name: Production build
        run: npm run build

  functional-e2e:
    name: Browser real - NEXUS 33
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Playwright dependency
        run: npm install --no-save playwright

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run functional browser audit
        env:
          NEXUS_E2E_EMAIL: ${{ secrets.NEXUS_E2E_EMAIL }}
          NEXUS_E2E_PASSWORD: ${{ secrets.NEXUS_E2E_PASSWORD }}
        run: node scripts/nexus-functional-e2e.mjs

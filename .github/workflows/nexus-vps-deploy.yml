name: Nexus VPS Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: nexus-vps-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Governance audit — analyst only
        run: node scripts/nexus-governance-audit.mjs

      - name: AI provider governance audit
        run: node scripts/nexus-ai-governance-audit.mjs

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test -- --run

      - name: Production build
        run: npm run build

      - name: Deploy through SSH
        env:
          VPS_HOST: ${{ secrets.NEXUS_VPS_HOST }}
          VPS_USER: ${{ secrets.NEXUS_VPS_USER }}
          VPS_PORT: ${{ secrets.NEXUS_VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.NEXUS_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Missing NEXUS_VPS_HOST repository secret}"
          : "${VPS_USER:?Missing NEXUS_VPS_USER repository secret}"
          : "${VPS_SSH_KEY:?Missing NEXUS_VPS_SSH_KEY repository secret}"
          PORT="${VPS_PORT:-22}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/nexus_vps_key
          chmod 600 ~/.ssh/nexus_vps_key
          ssh-keyscan -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/nexus_vps_key -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /root/nexus33
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          git clean -fd -e deploy/.env -e supabase-docker/.env
          bash deploy/update.sh
          REMOTE

      - name: Verify target account auth state
        env:
          VPS_HOST: ${{ secrets.NEXUS_VPS_HOST }}
          VPS_USER: ${{ secrets.NEXUS_VPS_USER }}
          VPS_PORT: ${{ secrets.NEXUS_VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.NEXUS_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null /tmp/nexus_key
          printf '%s\n' "$VPS_SSH_KEY" > /tmp/nexus_key
          ssh -o StrictHostKeyChecking=no -i /tmp/nexus_key -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" \
            "docker exec supabase-db psql -U postgres -d postgres -Atc \"select lower(u.email), (u.email_confirmed_at is not null), (u.banned_until is null), (u.deleted_at is null), u.last_sign_in_at from auth.users u where lower(u.email)=lower('joilsonmarinho43@gmail.com');\""
          rm -f /tmp/nexus_key

      - name: Install Playwright dependency
        run: npm install --no-save playwright

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run functional browser audit after deploy
        env:
          NEXUS_E2E_EMAIL: ${{ secrets.NEXUS_E2E_EMAIL }}
          NEXUS_E2E_PASSWORD: ${{ secrets.NEXUS_E2E_PASSWORD }}
        run: node scripts/nexus-functional-e2e.mjs

# Keep the production deploy workflow active on the corrected Nexus tree.
# Final production gate: validate the protected healthcheck and Telegram diagnostics after deploy.

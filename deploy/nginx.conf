server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compressão
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Assets com hash → cache longo
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Service worker e manifest nunca em cache
  location = /service-worker.js { add_header Cache-Control "no-cache"; }
  location = /manifest.json     { add_header Cache-Control "no-cache"; }
  location = /index.html        { add_header Cache-Control "no-store, must-revalidate"; }

  # SPA fallback (React Router)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Segurança básica
  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options SAMEORIGIN;
  add_header Referrer-Policy strict-origin-when-cross-origin;
}
